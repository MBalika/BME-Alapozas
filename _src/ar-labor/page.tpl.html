@font-face{font-family:'Inter';font-display:swap;font-weight:400;src:url(../fonts/inter-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Inter';font-display:swap;font-weight:400;src:url(../fonts/inter-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Inter';font-display:swap;font-weight:600;src:url(../fonts/inter-latin-600-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Inter';font-display:swap;font-weight:600;src:url(../fonts/inter-latin-ext-600-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
:root{
  --bg:#0b0e12; --bg2:#11161c; --card:#151b22; --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
  --ink:#eef1ea; --muted:#a2aab3; --lime:#ffb23e;
  --fh:'BarlowC','Barlow Condensed','Arial Narrow',sans-serif; --fb:'Inter',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --pad:40px; --max:1320px; --sc:#ffb23e; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0; background:var(--bg); color:var(--ink); font:400 17px/1.62 var(--fb); -webkit-font-smoothing:antialiased; overflow-x:hidden}
a{color:inherit}
button{font:inherit; color:inherit}
img{display:block; max-width:100%; height:auto}
.wrap{max-width:var(--max); margin:0 auto; padding:0 var(--pad)}
main p{text-align:justify; text-justify:inter-word; hyphens:manual; -webkit-hyphens:manual; text-wrap:pretty}
.nw{white-space:nowrap; hyphens:none}
.rag{text-align:left!important}
.twr{text-wrap:wrap!important}
/* fejléc */
.top{position:sticky; top:0; z-index:30; background:rgba(11,14,18,.82); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
.top .wrap{display:flex; align-items:center; justify-content:space-between; height:62px; gap:16px; max-width:none}
.brand{display:flex; align-items:center; gap:12px; font:800 20px/1 var(--fh); letter-spacing:.04em; text-transform:uppercase; text-decoration:none; white-space:nowrap}
.brand i{width:14px; height:22px; background:var(--lime); border-radius:3px; box-shadow:0 0 18px rgba(255,178,62,.55)}
.brand span{color:var(--muted); font-weight:700}
.top nav{display:flex; align-items:center; gap:22px; font:700 15px/1 var(--fh); letter-spacing:.06em; text-transform:uppercase}
.top nav a, .top nav button{text-decoration:none; color:var(--muted); background:none; border:0; padding:0; cursor:pointer; font:inherit; letter-spacing:inherit; text-transform:inherit}
.top nav a:hover, .top nav button:hover{color:var(--ink)}
.top nav .aula-btn{color:var(--bg); background:var(--lime); border-radius:999px; padding:9px 14px; box-shadow:0 0 24px rgba(255,178,62,.35)}
.top nav .aula-btn:hover{color:var(--bg); filter:brightness(1.08)}
.lang{display:inline-flex; border:1px solid var(--line2); border-radius:999px; overflow:hidden}
.lang a, .lang span{padding:6px 10px; font:800 13px/1 var(--fh); letter-spacing:.1em}
.lang span{background:var(--ink); color:var(--bg)}
.top nav .lang a{padding:6px 10px; font:800 13px/1 var(--fh); letter-spacing:.1em; color:var(--muted)} .top nav .lang a:hover{color:var(--ink)}
/* színpad */
.stage{position:relative; height:calc(100svh - 62px); min-height:600px; max-height:1100px; overflow:hidden; background:var(--bg); isolation:isolate}
.stage::before{content:""; position:absolute; inset:0; z-index:-2; background:radial-gradient(48% 62% at 64% 48%, color-mix(in srgb, var(--sc) 34%, transparent), transparent 72%), radial-gradient(40% 50% at 10% 95%, color-mix(in srgb, var(--sc) 14%, transparent), transparent 70%); transition:background .8s}
.floor{position:absolute; left:-40%; right:-40%; bottom:-6%; height:58%; z-index:-1; pointer-events:none;
  background-image:linear-gradient(color-mix(in srgb, var(--sc) 55%, transparent) 1.5px, transparent 1.5px), linear-gradient(90deg, color-mix(in srgb, var(--sc) 55%, transparent) 1.5px, transparent 1.5px);
  background-size:72px 72px; transform:perspective(520px) rotateX(66deg); transform-origin:50% 100%;
  -webkit-mask-image:linear-gradient(to top, rgba(0,0,0,.9), transparent 85%); mask-image:linear-gradient(to top, rgba(0,0,0,.9), transparent 85%); animation:floor 3.2s linear infinite; opacity:.8}
@keyframes floor{to{background-position:0 72px, 0 0}}
#mv{position:absolute; inset:0; width:100%; height:100%; background:transparent; --poster-color:transparent; --progress-bar-color:transparent; outline:none}
#mv::part(default-ar-button){display:none}
.loader{position:absolute; left:0; top:0; height:3px; width:0; background:var(--sc); box-shadow:0 0 14px var(--sc); z-index:8; transition:width .2s, opacity .4s}
.loader.done{opacity:0}
/* HUD */
.hud{position:absolute; left:var(--pad); bottom:96px; width:min(560px, 44%); z-index:5; pointer-events:none}
.hud > *{pointer-events:auto}
.kicker{display:block; font:800 15px/1.25 var(--fh); letter-spacing:.14em; text-transform:uppercase; color:var(--sc); transition:color .6s}
.kicker i{display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--sc); box-shadow:0 0 14px var(--sc); margin-right:10px; vertical-align:.08em}
.kicker span{color:var(--muted); letter-spacing:.1em; margin-left:8px; white-space:nowrap}
#mname{text-shadow:0 2px 28px rgba(0,0,0,.55); font:800 clamp(52px, 6.4vw, 112px)/.9 var(--fh); text-transform:uppercase; letter-spacing:-.005em; margin:14px 0 0; text-wrap:balance}
#mname.long{font-size:clamp(46px, 5vw, 88px)} #mname.xlong{font-size:clamp(40px, 4.1vw, 72px)}
body.aula #mname.long{font-size:clamp(60px, 5.8vw, 136px)} body.aula #mname.xlong{font-size:clamp(52px, 4.8vw, 112px)}
#mname .w{display:inline-block; overflow:hidden; vertical-align:top; padding-bottom:.04em; margin-bottom:-.04em}
#mname .w > span{display:inline-block}
.hook{text-shadow:0 1px 14px rgba(0,0,0,.7); font:600 clamp(17px, 1.45vw, 23px)/1.38 var(--fb); color:#d7dcd2; margin:16px 0 0; max-width:30em; text-align:left!important; text-wrap:pretty}
.facts{display:flex; gap:clamp(18px, 2.4vw, 40px); margin-top:24px; flex-wrap:wrap}
.fact b{text-shadow:0 2px 18px rgba(0,0,0,.5); display:block; font:800 clamp(34px, 3.4vw, 58px)/1 var(--fh); color:var(--sc); white-space:nowrap; transition:color .6s; font-variant-numeric:tabular-nums}
.fact span{display:block; font:600 13px/1.3 var(--fb); color:var(--muted); margin-top:6px; max-width:11em; text-transform:none}
.hud.in .kicker, .hud.in .hook, .hud.in .fact{animation:fadeUp .7s cubic-bezier(.2,.8,.2,1) both}
.hud.in .hook{animation-delay:.32s} .hud.in .fact{animation-delay:calc(.42s + var(--i) * .09s)}
.hud.in #mname .w > span{animation:wordUp .75s cubic-bezier(.2,.85,.2,1) both; animation-delay:calc(.08s + var(--i) * .07s)}
@keyframes fadeUp{from{opacity:0; transform:translateY(18px)}to{opacity:1; transform:none}}
@keyframes wordUp{from{transform:translateY(105%) skewY(6deg)}to{transform:none}}
/* számláló és nyilak */
.count{position:absolute; right:var(--pad); top:26px; z-index:5; font:800 clamp(38px, 4vw, 64px)/1 var(--fh); color:transparent; -webkit-text-stroke:1.5px rgba(255,255,255,.28); letter-spacing:.02em; pointer-events:none}
.count b{color:var(--sc); -webkit-text-stroke:0; transition:color .6s}
.nav-arrow{position:absolute; top:50%; z-index:6; width:58px; height:58px; margin-top:-29px; border-radius:50%; border:1px solid var(--line2); background:rgba(11,14,18,.55); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); display:grid; place-items:center; cursor:pointer; transition:transform .2s, border-color .2s, background .2s}
.nav-arrow:hover{transform:scale(1.08); border-color:var(--sc); background:rgba(11,14,18,.8)}
.nav-arrow svg{width:24px; height:24px}
.nav-arrow.prev{left:16px} .nav-arrow.next{right:16px}
@media (min-width:761px){ .nav-arrow{top:104px; margin-top:0; width:52px; height:52px} .nav-arrow.prev{left:auto; right:calc(var(--pad) + 62px)} .nav-arrow.next{right:var(--pad)} .count{top:22px} }
/* vezérlők */
.ctrl{position:absolute; right:var(--pad); bottom:32px; z-index:6; display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:flex-end; max-width:60%}
.btn{display:inline-flex; align-items:center; gap:9px; height:48px; padding:0 18px; border-radius:999px; border:1px solid var(--line2); background:rgba(11,14,18,.6); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); font:800 16px/1 var(--fh); letter-spacing:.08em; text-transform:uppercase; cursor:pointer; white-space:nowrap; transition:border-color .2s, background .2s, transform .15s}
.btn:hover{border-color:rgba(255,255,255,.4)}
.btn:active{transform:scale(.97)}
.btn svg{width:18px; height:18px; flex:none}
.btn.ic{width:48px; padding:0; justify-content:center}
.btn[hidden]{display:none}
.btn[aria-pressed="true"]{border-color:var(--sc); color:var(--sc)}
.btn.act{background:var(--sc); color:#0b0e12; border-color:transparent; box-shadow:0 0 30px color-mix(in srgb, var(--sc) 55%, transparent); animation:pulse 2.4s ease-in-out infinite}
.btn.act:hover{filter:brightness(1.08)}
@keyframes pulse{0%,100%{box-shadow:0 0 18px color-mix(in srgb, var(--sc) 40%, transparent)}50%{box-shadow:0 0 38px color-mix(in srgb, var(--sc) 75%, transparent)}}
.prog{position:absolute; left:0; right:0; bottom:0; height:4px; z-index:6; background:rgba(255,255,255,.06); cursor:pointer}
.prog i{position:absolute; left:0; top:0; bottom:0; width:0; background:var(--sc); box-shadow:0 0 12px var(--sc)}
.prog[hidden]{display:none}
.hint{position:absolute; left:50%; top:22px; transform:translateX(-50%); z-index:6; font:700 14px/1 var(--fh); letter-spacing:.12em; text-transform:uppercase; color:var(--muted); background:rgba(11,14,18,.6); border:1px solid var(--line); padding:9px 14px; border-radius:999px; white-space:nowrap; pointer-events:none; transition:opacity .5s}
.hint.off{opacity:0}
/* átmenet: szakirányszínű csík söpör át */
.wipe{position:absolute; inset:0; z-index:7; pointer-events:none; overflow:hidden}
.wipe::before, .wipe::after{content:""; position:absolute; top:-20%; bottom:-20%; left:0; width:130%; transform:translateX(-140%) skewX(-12deg)}
.wipe::before{background:var(--sc)}
.wipe::after{background:#0b0e12; width:118%}
.stage.wiping .wipe::before{animation:wipe .95s cubic-bezier(.75,0,.25,1) both}
.stage.wiping .wipe::after{animation:wipe .95s cubic-bezier(.75,0,.25,1) .07s both}
@keyframes wipe{from{transform:translateX(-140%) skewX(-12deg)}to{transform:translateX(140%) skewX(-12deg)}}
/* polc */
section{padding:72px 0}
.sec-h{display:flex; align-items:end; justify-content:space-between; gap:24px; flex-wrap:wrap; margin-bottom:26px}
h2{font:800 clamp(40px, 4.4vw, 68px)/.95 var(--fh); text-transform:uppercase; margin:0}
h2 em{font-style:normal; color:var(--lime)}
.chips{display:flex; gap:8px; flex-wrap:wrap}
.chip{display:inline-flex; align-items:center; gap:8px; height:36px; padding:0 14px; border-radius:999px; border:1px solid var(--line2); background:transparent; cursor:pointer; font:800 14px/1 var(--fh); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); white-space:nowrap}
.chip i{width:9px; height:9px; border-radius:50%; background:var(--c, var(--ink))}
.chip[aria-pressed="true"]{color:var(--ink); border-color:var(--c, var(--ink)); background:color-mix(in srgb, var(--c, #fff) 14%, transparent)}
.cards{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:18px}
.card{position:relative; text-align:left; border:1px solid var(--line); background:var(--card); border-radius:16px; overflow:hidden; cursor:pointer; padding:0; transition:transform .2s, border-color .2s, box-shadow .2s}
.card::before{content:""; position:absolute; left:0; right:0; top:0; height:4px; background:var(--c); z-index:1}
.card:hover{transform:translateY(-4px); border-color:color-mix(in srgb, var(--c) 60%, transparent); box-shadow:0 14px 40px -12px color-mix(in srgb, var(--c) 45%, transparent)}
.card[aria-pressed="true"]{border-color:var(--c); box-shadow:0 0 0 1px var(--c), 0 14px 40px -12px color-mix(in srgb, var(--c) 55%, transparent)}
.card img{width:100%; aspect-ratio:16/10; object-fit:cover; background:#e8eef2}
.card .t{display:block; padding:14px 16px 16px}
.card .t small{display:block; font:800 13px/1.15 var(--fh); letter-spacing:.1em; text-transform:uppercase; color:var(--c)}
.card .t b{display:block; font:800 26px/1.02 var(--fh); text-transform:uppercase; margin-top:6px}
.card .t span{display:block; font:400 14px/1.4 var(--fb); color:var(--muted); margin-top:6px}
.card[hidden]{display:none}
/* részletek */
.detail{display:grid; grid-template-columns:1.25fr .75fr; gap:48px; align-items:start}
.detail h3{font:800 clamp(30px, 2.6vw, 40px)/1 var(--fh); text-transform:uppercase; margin:0 0 14px}
.detail p{margin:0 0 14px; color:#d4d9d0}
.where{display:flex; gap:14px; align-items:center; margin-top:18px; padding:16px 18px; border-radius:14px; border:1px solid var(--line); background:var(--bg2)}
.where i{width:12px; height:44px; border-radius:6px; background:var(--sc); flex:none; box-shadow:0 0 18px var(--sc)}
.where b{display:block; font:800 22px/1.05 var(--fh); text-transform:uppercase}
.where span{display:block; color:var(--muted); font-size:14px; margin-top:4px}
.qrbox{border:1px solid var(--line); background:var(--bg2); border-radius:18px; padding:22px; text-align:center}
.qrbox .q{background:#fff; border-radius:12px; padding:14px; width:220px; margin:0 auto}
.qrbox .q svg{display:block; width:100%; height:auto}
.qrbox b{display:block; font:800 24px/1.05 var(--fh); text-transform:uppercase; margin-top:16px}
.qrbox span{display:block; color:var(--muted); font-size:14px; margin-top:6px}
/* szakirányok */
.bsc{margin-top:8px}
.bsc + .bsc{margin-top:34px}
.bsc-h{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:14px}
.bsc-h b{font:800 30px/1 var(--fh); text-transform:uppercase}
.bsc-h span{color:var(--muted); font:700 15px/1 var(--fh); letter-spacing:.1em; text-transform:uppercase}
.specs{display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:14px}
.spec{border:1px solid var(--line); border-radius:16px; padding:18px; background:linear-gradient(160deg, color-mix(in srgb, var(--c) 16%, transparent), transparent 55%), var(--card); position:relative; overflow:hidden}
.spec b{display:block; font:800 24px/1.02 var(--fh); text-transform:uppercase; color:var(--c)}
.spec p{font-size:15px; line-height:1.5; margin:10px 0 12px; color:#d4d9d0}
.spec .ms{display:flex; gap:6px; flex-wrap:wrap}
.spec .ms button{border:1px solid color-mix(in srgb, var(--c) 55%, transparent); background:transparent; color:var(--ink); border-radius:999px; padding:6px 10px; font:700 13px/1 var(--fh); letter-spacing:.06em; text-transform:uppercase; cursor:pointer}
.spec .ms button:hover{background:color-mix(in srgb, var(--c) 20%, transparent)}
.spec .ms em{font:700 13px/1 var(--fh); letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-style:normal; padding:6px 0}
footer{border-top:1px solid var(--line); padding:28px 0 40px; color:var(--muted); font-size:14px}
footer .wrap{display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap}
footer a{color:var(--ink)}
/* AULA mód: teljes képernyő, nagy betűk, magától léptet */
.aula-only{display:none}
body.aula{overflow:hidden; cursor:default}
body.aula.idle, body.aula.idle *{cursor:none!important}
body.aula .top, body.aula main > section, body.aula footer{display:none}
body.aula .stage{height:100vh; max-height:none; min-height:0}
body.aula .aula-only{display:block}
body.aula .hud{left:64px; bottom:120px; width:min(900px, 52%)}
body.aula #mname{font-size:clamp(72px, 7.2vw, 170px)}
body.aula .hint{display:none}
body.aula .kicker{font-size:clamp(18px, 1.4vw, 28px)}
body.aula .hook{font-size:clamp(22px, 1.8vw, 36px)}
body.aula .fact b{font-size:clamp(48px, 4.6vw, 96px)}
body.aula .fact span{font-size:clamp(14px, 1vw, 20px)}
body.aula .nav-arrow, body.aula .ctrl .opt{display:none}
body.aula .ctrl{right:auto; left:64px; bottom:40px}
body.aula .count{top:40px; right:64px}
.abrand{position:absolute; left:64px; top:40px; z-index:6; font:800 clamp(20px, 1.6vw, 30px)/1 var(--fh); letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
.abrand b{color:var(--lime)}
.aqr{display:none; position:absolute; right:var(--pad); top:170px; z-index:6; width:200px; text-align:center; border-radius:20px; padding:14px; background:rgba(11,14,18,.74); border:1px solid var(--line2); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px)}

<script>
(() => {
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const D = /*DATA*/null;
const { SPECS, BSC, M, T } = D;
const mv = $('#mv'), stage = $('#stage'), hud = $('#hud');
const abs = (u) => new URL(u, document.baseURI).href; // az AR-nézők teljes címet kérnek
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const params = new URLSearchParams(location.search);
let cur = null, labels = false, userPaused = false, aula = false;

/* ---------- polc, szűrők, szakirányok ---------- */
const order = Object.keys(SPECS);
const shelf = [...M].sort((a, b) => order.indexOf(a.sp) - order.indexOf(b.sp));
$('#cards').innerHTML = shelf.map(m => { const s = SPECS[m.sp]; return `<button type="button" class="card" data-id="${m.id}" data-sp="${m.sp}" style="--c:${s.c}" aria-pressed="false"><img src="img/${m.img || m.f || m.id}.jpg" alt="" width="800" height="500" loading="lazy"><span class="t"><small>${s.short}</small><b>${m.name}</b><span>${m.hook}</span></span></button>`; }).join('');
const present = order.filter(k => M.some(m => m.sp === k));
$('#chips').innerHTML = `<button type="button" class="chip" data-sp="" aria-pressed="true">${T.all}</button>` + present.map(k => `<button type="button" class="chip" data-sp="${k}" style="--c:${SPECS[k].c}" aria-pressed="false"><i></i>${SPECS[k].short}</button>`).join('');
$('#chips').addEventListener('click', (e) => { const b = e.target.closest('.chip'); if (!b) return; const sp = b.dataset.sp;
  $$('.chip').forEach(c => c.setAttribute('aria-pressed', String(c === b))); $$('.card').forEach(c => c.hidden = !!sp && c.dataset.sp !== sp); });
$('#cards').addEventListener('click', (e) => { const b = e.target.closest('.card'); if (b) { select(b.dataset.id); stage.scrollIntoView({ behavior: RM ? 'auto' : 'smooth' }); } });
$('#bscs').innerHTML = Object.entries(BSC).map(([bk, b]) => `<div class="bsc"><div class="bsc-h"><b>${b.n}</b><span>${b.d}</span></div><div class="specs">` +
  order.filter(k => SPECS[k].b === bk).map(k => { const s = SPECS[k], ms = M.filter(m => m.sp === k);
    return `<div class="spec" style="--c:${s.c}"><small>${s.k}</small><b>${s.n}</b><p class="hyphenate">${s.d}</p><div class="ms">${ms.length ? ms.map(m => `<button type="button" data-id="${m.id}">${m.name}</button>`).join('') : `<em>${T.soon}</em>`}</div><a class="app" href="${s.url}" target="_blank" rel="noopener">${T.open} <span aria-hidden="true">↗</span></a></div>`; }).join('') + '</div></div>').join('');
$('#bscs').addEventListener('click', (e) => { const b = e.target.closest('button[data-id]'); if (b) { select(b.dataset.id); stage.scrollIntoView({ behavior: RM ? 'auto' : 'smooth' }); } });
$$('[data-go]').forEach(b => b.addEventListener('click', () => document.getElementById(b.dataset.go).scrollIntoView({ behavior: RM ? 'auto' : 'smooth' })));

/* ---------- QR ---------- */
const linkOf = (m) => location.origin + location.pathname + '?m=' + m.id + '&ar=1'; // a telefonon rögtön az AR-indító nyílik meg
function qrSvg(text) { try { const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); } catch (e) { return ''; } }

/* ---------- számláló (count-up) ---------- */
function countUp(el, txt, delay) {
  const EN = D.lang === 'en'; const m = EN ? txt.match(/^(\D*?)(\d{1,3}(?:,\d{3})+|\d+(?:\.\d+)?)(.*)$/) : txt.match(/^(\D*?)(\d{1,3}(?:[ \u00a0\u202f]\d{3})+|\d+(?:,\d+)?)(.*)$/);
  if (!m || RM) { el.textContent = txt; return; }
  const [, pre, num, post] = m; const sep = EN ? (num.includes(',') ? ',' : '') : (num.match(/[ \u00a0\u202f]/) || [''])[0], dec = EN ? (num.includes('.') ? '.' : '') : (num.includes(',') ? ',' : '');
  const v = parseFloat(EN ? num.replace(/,/g, '') : num.replace(/[ \u00a0\u202f]/g, '').replace(',', '.')), nd = dec ? num.split(dec)[1].length : 0;
  const fmt = (x) => { let s = x.toFixed(nd); if (dec) s = s.replace('.', dec); if (sep) s = s.replace(/\B(?=(\d{3})+(?!\d))/g, sep); return pre + s + post; };
  el.textContent = fmt(0); const t0 = performance.now() + delay, dur = 1100;
  const tick = (t) => { const k = Math.min(1, Math.max(0, (t - t0) / dur)); el.textContent = fmt(v * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(tick); else el.textContent = txt; };
  requestAnimationFrame(tick);
}

/* ---------- modell kiválasztása ---------- */
const EN = D.lang === 'en'; const fileOf = (m) => (m.f || m.id) + (labels ? (EN ? '-feliratok-en' : '-feliratok') : (EN && m.en ? '-en' : '')); // m.en: a névtábla miatt a felirat nélküli modellnek is van angol változata
function setSrc(m) { const f = fileOf(m); mv.setAttribute('ios-src', abs('models/' + f + '.usdz')); mv.setAttribute('src', abs('models/' + f + '.glb')); }
function paintHud(m) {
  const s = SPECS[m.sp]; document.documentElement.style.setProperty('--sc', s.c);
  $('#kicker').innerHTML = `<i></i>${s.k}<span>· ${s.n}</span>`;
  $('#mname').className = m.name.length > 32 ? 'xlong' : m.name.length > 22 ? 'long' : ''; // hosszú név: kisebb betű, hogy ne takarja a modellt
  $('#mname').innerHTML = m.name.split(' ').map((w, i) => `<span class="w"><span style="--i:${i}">${w}</span></span>`).join(' ');
  $('#mhook').textContent = m.hook;
  $('#facts').innerHTML = m.facts.map(([v, l], i) => `<div class="fact" style="--i:${i}"><b></b><span>${l}</span></div>`).join('');
  $$('#facts .fact b').forEach((b, i) => countUp(b, m.facts[i][0], RM ? 0 : 450 + i * 90));
  $('#actBtn span').textContent = m.act; $('#actBtn').dataset.kind = m.kind;
  const i = M.indexOf(m); $('#count').innerHTML = `<b>${String(i + 1).padStart(2, '0')}</b> / ${String(M.length).padStart(2, '0')}`;
  hud.classList.remove('in'); void hud.offsetWidth; hud.classList.add('in');
  $('#dname').textContent = m.name; $('#minfo').textContent = m.info; $('#dspec').textContent = s.n; $('#dbsc').textContent = s.k + ' · ' + T.learn; $('#dwhere').href = s.url;
  { const a = $('#dlink'); a.hidden = !m.link; if (m.link) { a.href = m.link[2]; $('#dlinkT').textContent = m.link[0]; $('#dlinkS').textContent = m.link[1]; } }
  $$('.card').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === m.id)));
  const svg = qrSvg(linkOf(m)); $('#qr').innerHTML = svg; $('#aqr').innerHTML = svg;
  $$('#ticker i').forEach((t, j) => { t.classList.toggle('done', j < i); const b = t.querySelector('b'); b.style.transition = 'none'; b.style.width = '0'; });
}
function select(id, opt = {}) {
  const m = M.find(x => x.id === id) || M[0]; if (cur === m && !opt.force) return; const first = !cur; cur = m;
  try { const u = new URL(location.href); u.searchParams.set('m', m.id); history.replaceState(null, '', u); } catch (e) {}
  { const ll = $('#langLink'); if (ll) ll.href = (D.lang === 'en' ? '/ar-labor' : '/ar-labor/en') + '?m=' + m.id; }
  const swap = () => { paintHud(m); loading(m); setSrc(m); };
  if (first || RM) { swap(); return; }
  stage.classList.remove('wiping'); void stage.offsetWidth; stage.classList.add('wiping');
  setTimeout(swap, 430); setTimeout(() => stage.classList.remove('wiping'), 1100);
}
function loading(m) {
  const [th, ph] = m.orbit.split(' '); mv.setAttribute('camera-target', 'auto auto auto'); mv.setAttribute('camera-orbit', `${parseFloat(th) - 38}deg ${parseFloat(ph) - 12}deg 220%`); mv.jumpCameraToGoal && mv.jumpCameraToGoal();
  mv.setAttribute('alt', m.name); const L = $('#loader'); L.classList.remove('done'); L.style.width = '8%';
  $('#prog').hidden = !m.anim; $('#lblBtn').setAttribute('aria-pressed', String(labels));
}
mv.addEventListener('progress', (e) => { $('#loader').style.width = (8 + 92 * e.detail.totalProgress) + '%'; if (e.detail.totalProgress >= 1) $('#loader').classList.add('done'); });
mv.addEventListener('load', () => {
  const m = cur; $('#loader').classList.add('done');
  mv.setAttribute('camera-orbit', m.orbit); // berepülés a kamerával
  if (m.anim) { if (labels && m.labelT != null) { mv.pause(); mv.currentTime = m.labelT; } else if (!userPaused) { mv.currentTime = 0; mv.play(); } }
  syncPlay(); applyMotion(1600); if (aula) tourArm(); preloadNext();
});
function preloadNext() { const n = M[(M.indexOf(cur) + 1) % M.length]; try { fetch(abs('models/' + fileOf(n) + '.glb')).catch(() => {}); } catch (e) {} }
const go = (d) => { const i = M.indexOf(cur); select(M[(i + d + M.length) % M.length].id); };
$('#prev').addEventListener('click', () => go(-1)); $('#next').addEventListener('click', () => go(1));

/* ---------- animáció, feliratok, forgatás ---------- */
const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>', PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
function syncPlay() { const b = $('#playBtn'); const on = cur && cur.anim && !mv.paused; b.hidden = !(cur && cur.anim); b.innerHTML = on ? PAUSE : PLAY; b.setAttribute('aria-label', on ? T.pause : T.play); }
$('#playBtn').addEventListener('click', () => { if (!cur.anim) return; if (mv.paused) { if (labels) setLabels(false); userPaused = false; mv.play(); } else { userPaused = true; mv.pause(); } syncPlay(); });
function setLabels(on) { labels = on; $('#lblBtn').setAttribute('aria-pressed', String(on)); stage.classList.toggle('lbl', on);
  /* feliratokkal a modell a saját nézőpontjából látszik (a táblák szembe néznek), és úgy, hogy minden felirat beférjen; kikapcsoláskor vissza az alapnézet */
  const keep = cur.orbit; if (on) { const [th, ph] = keep.split(' '); cur.orbit = `${th} ${ph} 104%`; } mv.setAttribute('camera-target', 'auto auto auto');
  setSrc(cur); mv.addEventListener('load', () => { cur.orbit = keep; }, { once: true }); }
$('#lblBtn').addEventListener('click', () => setLabels(!labels));
$('#actBtn').addEventListener('click', () => { const k = $('#actBtn').dataset.kind;
  if (k === 'labels') { setLabels(!labels); return; }
  if (labels) { setLabels(false); userPaused = false; return; }
  userPaused = false; mv.currentTime = 0; mv.play(); syncPlay(); });
/* mozgás: teljes 3D-s makettek körbeforognak, a metszetes makettek (sec) csak ide-oda lengenek a nézet körül */
let rotating = true, lastUser = 0; const swing = { on: false, t0: 0, th0: 0, phi: 75, r: '100%', hold: false };
function anchorSwing(delay = 0) { try { const o = mv.getCameraOrbit(); swing.th0 = o.theta * 180 / Math.PI; swing.phi = o.phi * 180 / Math.PI; swing.r = o.radius + 'm'; } catch (e) {} swing.t0 = performance.now() + delay; }
function applyMotion(delay = 0) { const sec = cur && cur.sec, mov = rotating && !labels; /* feliratokkal a modell áll: a táblák a fő nézőpont felé néznek, forgás közben élükről látszanának */ mv.toggleAttribute('auto-rotate', mov && !sec); swing.on = mov && !!sec; if (swing.on) { swing.hold = true; setTimeout(() => { anchorSwing(); swing.hold = false; }, delay); } $('#rotBtn').setAttribute('aria-pressed', String(rotating)); }
mv.addEventListener('camera-change', (e) => { if (e.detail.source === 'user-interaction') { lastUser = performance.now(); swing.hold = true; } });
$('#rotBtn').addEventListener('click', () => { rotating = !rotating; applyMotion(); });
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
function toggleFS(el = stage) { if (fsEl()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; } const r = el.requestFullscreen || el.webkitRequestFullscreen; if (r) try { const p = r.call(el); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
$('#fsBtn').addEventListener('click', () => toggleFS());
$('#prog').addEventListener('click', (e) => { if (!cur.anim || !mv.duration) return; const r = e.currentTarget.getBoundingClientRect(); if (labels) setLabels(false); mv.currentTime = (e.clientX - r.left) / r.width * mv.duration; if (mv.paused && !userPaused) mv.play(); });
(function loop(now) { if (cur && cur.anim && mv.duration) $('#prog i').style.width = (100 * (mv.currentTime % mv.duration) / mv.duration).toFixed(2) + '%';
  if (swing.on && mv.loaded) { if (swing.hold && lastUser && now - lastUser > 2500) { lastUser = 0; anchorSwing(); swing.hold = false; }
    if (!swing.hold && now > swing.t0) { const th = swing.th0 + 34 * Math.sin(2 * Math.PI * (now - swing.t0) / 18000); mv.cameraOrbit = `${th.toFixed(2)}deg ${swing.phi.toFixed(2)}deg ${swing.r}`; } }
  requestAnimationFrame(loop); })(performance.now());
mv.addEventListener('play', syncPlay); mv.addEventListener('pause', syncPlay);
setTimeout(() => $('#hint').classList.add('off'), 7000);

/* ---------- AR ---------- */
/* telefonon nagy gomb → rövid útmutató → indítás. Android (Chrome + ARCore): saját WebXR-nézet (xr.js): keret mutatja, hová kerül a modell,
   koppintásra lekerül és a helyén marad. iPhone: Quick Look, más Androidon Scene Viewer (model-viewer). Gépen és kivetítőn QR-kód (.aqr). */
const UA = navigator.userAgent, IOS = /iPhone|iPad|iPod/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const MOBILE = IOS || /Android|Mobile/i.test(UA);
const IN_APP = /Instagram|FBAN|FBAV|FB_IAB|FBIOS|Messenger|Line\/|; wv\)|TikTok|musical_ly|BytedanceWebview|Snapchat|GSA\//i.test(UA); // beépített böngészők: ott nem indul az AR
let arMode = null, XRP = null, sheetAuto = MOBILE && params.has('ar');
function syncAR() { if (arMode !== 'xr') arMode = (!IN_APP && customElements.get('model-viewer') && mv.canActivateAR) ? (IOS ? 'ql' : 'sv') : 'none';
  $('#arFab').hidden = !MOBILE; $('#arFab').classList.toggle('off', arMode === 'none'); }
(async () => { try { if (navigator.xr && await navigator.xr.isSessionSupported('immersive-ar')) { arMode = 'xr'; XRP = import('./xr.js'); XRP.catch(() => {}); } } catch (e) {} syncAR(); })();
customElements.whenDefined('model-viewer').then(() => { mv.addEventListener('load', () => { syncAR(); if (sheetAuto) { sheetAuto = false; openSheet(); } }); setTimeout(syncAR, 1200); });
function openSheet() { syncAR(); const none = arMode === 'none';
  $('#arsM').textContent = cur.name; $('#arsSteps').innerHTML = none ? '' : T.arSteps[arMode === 'xr' ? 'xr' : 'ql'].map(t => `<li>${t}</li>`).join('');
  $('#arsSteps').hidden = none; $('#arsNo').hidden = !none; $('#arsNo').textContent = T.arNo; $('#arsGo span').textContent = none ? T.arCopy : T.arGo;
  $('#arSheet').hidden = false; setTimeout(() => $('#arsGo').focus(), 50);
  try { const u = new URL(location.href); if (u.searchParams.has('ar')) { u.searchParams.delete('ar'); history.replaceState(null, '', u); } } catch (e) {} }
const closeSheet = () => { $('#arSheet').hidden = true; };
$('#arFab').addEventListener('click', openSheet);
$('#arsX').addEventListener('click', closeSheet);
$('#arSheet').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeSheet(); });
$('#arsGo').addEventListener('click', () => { if (arMode === 'none') { const l = location.origin + location.pathname + '?m=' + cur.id + '&ar=1';
    (navigator.clipboard ? navigator.clipboard.writeText(l) : Promise.reject()).then(() => { $('#arsGo span').textContent = T.arCopied; }).catch(() => { prompt('', l); }); return; }
  closeSheet(); startAR(); });
function startAR() {
  if (arMode === 'xr') { const ui = $('#xrui'), base = cur.f || cur.id, lab = D.lang === 'en' ? '-feliratok-en' : '-feliratok'; ui.classList.add('on'); $('#xrAct span').textContent = cur.act;
    let sp; try { sp = navigator.xr.requestSession('immersive-ar', { requiredFeatures: ['hit-test'], optionalFeatures: ['dom-overlay', 'anchors', 'local-floor'], domOverlay: { root: ui } }); } catch (e) { sp = Promise.reject(e); }
    const was = !mv.paused; mv.pause();
    Promise.all([sp, XRP]).then(([s, X]) => { ui.classList.add('live');
      return X.run(s, { ui, T: T.xr, title: cur.name, labels, url: abs('models/' + base + (D.lang === 'en' && cur.en ? '-en' : '') + '.glb'), urlLabels: abs('models/' + base + lab + '.glb'),
        onEnd: () => { ui.classList.remove('on', 'live'); if (was && !userPaused) mv.play(); } }).catch((e) => { try { s.end(); } catch (x) {} throw e; }); })
      .catch((e) => { console.warn('WebXR', e); ui.classList.remove('on', 'live'); if (was) mv.play(); if (mv.canActivateAR) try { mv.activateAR(); } catch (x) {} });
    return; }
  try { mv.activateAR(); } catch (e) {}
}

/* ---------- AULA mód: magától léptet, ha hozzányúlnak, átadja az irányítást ---------- */
$('#ticker').innerHTML = M.map(() => '<i><b></b></i>').join('');
let tourT = 0, manualT = 0, manualLeft = 0, idleT = 0;
function dwell() { const d = cur.anim && mv.duration ? mv.duration + 3 : 18; return Math.max(18, Math.min(34, d)) * 1000; }
function tourArm() { clearTimeout(tourT); if (!aula || manualLeft > 0) return; const ms = dwell(); const t = $$('#ticker i')[M.indexOf(cur)]; if (t) { const b = t.querySelector('b'); b.style.transition = 'none'; b.style.width = '0'; void b.offsetWidth; b.style.transition = `width ${ms}ms linear`; b.style.width = '100%'; }
  tourT = setTimeout(() => go(1), ms); }
function manual() { if (!aula) return; clearTimeout(tourT); manualLeft = 40; const b = $$('#ticker i')[M.indexOf(cur)]; if (b) { const x = b.querySelector('b'); x.style.transition = 'none'; x.style.width = '0'; }
  const show = () => { $('#manual').textContent = T.manual.replace('{s}', manualLeft); $('#manual').classList.add('on'); };
  show(); clearInterval(manualT); manualT = setInterval(() => { manualLeft--; if (manualLeft <= 0) { clearInterval(manualT); $('#manual').classList.remove('on'); if (labels) setLabels(false); rotating = true; applyMotion(); go(1); } else show(); }, 1000); }
function setAula(on) { aula = on; document.body.classList.toggle('aula', on); clearTimeout(tourT); clearInterval(manualT); manualLeft = 0; $('#manual').classList.remove('on');
  try { const u = new URL(location.href); on ? u.searchParams.set('aula', '1') : u.searchParams.delete('aula'); history.replaceState(null, '', u); } catch (e) {}
  if (on) { rotating = true; applyMotion(); mv.setAttribute('rotation-per-second', '10deg'); userPaused = false; if (labels) setLabels(false); tourArm();
    setTimeout(() => { if (!fsEl() && manualLeft <= 0) { $('#manual').textContent = T.fsHint; $('#manual').classList.add('on'); setTimeout(() => { if (manualLeft <= 0) $('#manual').classList.remove('on'); }, 6000); } }, 900); }
  else { mv.setAttribute('rotation-per-second', '14deg'); if (fsEl()) toggleFS(); } }
$('#aulaBtn').addEventListener('click', () => { setAula(true); toggleFS(document.documentElement); });
$('#aexit').addEventListener('click', () => setAula(false));
['pointerdown', 'wheel'].forEach(ev => stage.addEventListener(ev, (e) => { if (aula && !e.target.closest('.aexit')) manual(); }, { passive: true }));
addEventListener('pointermove', () => { if (!aula) return; document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add('idle'), 2500); });
addEventListener('keydown', (e) => { if (e.target.closest && e.target.closest('input, textarea')) return; const k = e.key.toLowerCase();
  if (k === 'arrowright') { go(1); manual(); } else if (k === 'arrowleft') { go(-1); manual(); }
  else if (k === ' ' && aula) { e.preventDefault(); $('#playBtn').click(); manual(); }
  else if (k === 'l') { setLabels(!labels); manual(); } else if (k === 'r') $('#rotBtn').click();
  else if (k === 'f') toggleFS(aula ? document.documentElement : stage);
  else if (k === 'a') setAula(!aula); else if (k === 'escape' && !$('#arSheet').hidden) closeSheet(); else if (k === 'escape' && aula && !fsEl()) setAula(false); });

/* ---------- indulás ---------- */
{ const h = decodeURIComponent(location.hash.slice(1)), q = params.get('m'); select(q && M.some(m => m.id === q) ? q : (h && M.some(m => m.id === h) ? h : M[0].id)); if (h) try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
if (params.has('aula')) setAula(true);
window.__arl = { M, select, setAula };
/*GUARD*/
})();
</script>
</body>
</html>
