<script type="module">
import * as THREE from 'three';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { USDZExporter } from 'three/addons/exporters/USDZExporter.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { fontsReady, resetMats } from './lib/common.js';

const b64 = (buf) => { const u8 = new Uint8Array(buf); let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
async function load(id, lang, withLabels) {
  resetMats(); await fontsReady();
  const mod = await import('./models/' + id + '.js?t=' + Date.now());
  const r = mod.build({ lang });
  const root = new THREE.Group(); root.name = 'model_' + id; root.add(r.root); root.scale.setScalar(r.k);
  if (withLabels && r.labels) r.root.add(r.labels(lang));
  root.updateMatrixWorld(true);
  return { mod, r, root };
}
window.exportModel = async (id, lang, withLabels) => {
  const { mod, r, root } = await load(id, lang, withLabels);
  const scene = new THREE.Scene(); scene.add(root); scene.updateMatrixWorld(true);
  const glb = await new GLTFExporter().parseAsync(scene, { binary: true, animations: r.clips || [], onlyVisible: true });
  // USDZ: animáció nélkül, a nyugalmi állapot
  if (r.pose) { r.pose(); scene.updateMatrixWorld(true); } // morf-animációs modell: az állókép a hálóba égetve
  const usdz = await new USDZExporter().parseAsync(scene, { quickLookCompatible: true });
  const bb = new THREE.Box3().setFromObject(root); const s = bb.getSize(new THREE.Vector3());
  return { glb: b64(glb), usdz: b64(usdz), size: [s.x, s.y, s.z].map(v => +v.toFixed(3)), file: mod.FILE || id };
};
window.poster = async (id, w = 1120, h = 700, zoom = null, withLabels = false, tOver = null) => {
  const { mod, r, root } = await load(id, 'hu', withLabels);
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); renderer.setSize(w, h); renderer.setPixelRatio(1);
  renderer.toneMapping = THREE.NeutralToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace; document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene(); scene.background = new THREE.Color('#e8eef2');
  const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.75;
  const dl = new THREE.DirectionalLight(0xffffff, 1.3); dl.position.set(2, 4, 3); scene.add(dl); scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8478, 0.35));
  scene.add(root);
  // az animáció egy pillanata (ha van)
  if (r.clips && r.clips.length) { const mx = new THREE.AnimationMixer(root); for (const c of r.clips) mx.clipAction(c).play(); mx.update(tOver ?? (withLabels ? r.labelT : null) ?? r.posterT ?? 0); }
  const bb = new THREE.Box3().setFromObject(root); const c = bb.getCenter(new THREE.Vector3()), sz = bb.getSize(new THREE.Vector3());
  const cam = new THREE.PerspectiveCamera(28, w / h, 0.01, 100); const [az, el] = r.posterView || [30, 22];
  const a = az * Math.PI / 180, e = el * Math.PI / 180, dir = new THREE.Vector3(Math.sin(a) * Math.cos(e), Math.sin(e), Math.cos(a) * Math.cos(e));
  const tgt = c.clone(); tgt.y += (r.posterLift || 0) * sz.y;
  const corners = []; for (const x of [bb.min.x, bb.max.x]) for (const y of [bb.min.y, bb.max.y]) for (const z of [bb.min.z, bb.max.z]) corners.push(new THREE.Vector3(x, y, z));
  let R = sz.length(); for (let it = 0; it < 40; it++) { cam.position.copy(tgt).addScaledVector(dir, R); cam.lookAt(tgt); cam.updateMatrixWorld(); cam.updateProjectionMatrix();
    let m = 0; for (const p of corners) { const q = p.clone().project(cam); m = Math.max(m, Math.abs(q.x), Math.abs(q.y)); } R *= m / (r.posterFill || 0.86); }
  if (zoom) { const [zx, zy, zz, zr, zaz, zel] = zoom; const a2 = zaz * Math.PI / 180, e2 = zel * Math.PI / 180; const d2 = new THREE.Vector3(Math.sin(a2) * Math.cos(e2), Math.sin(e2), Math.cos(a2) * Math.cos(e2));
    tgt.set(zx * r.k, zy * r.k, zz * r.k); R = zr * r.k / Math.tan(14 * Math.PI / 180); dir.copy(d2); }
  cam.position.copy(tgt).addScaledVector(dir, R); cam.lookAt(tgt);
  renderer.render(scene, cam); const url = renderer.domElement.toDataURL('image/jpeg', 0.9); renderer.dispose(); renderer.domElement.remove(); return { url, file: mod.FILE || id };
};
window.ready = true;
</script>
